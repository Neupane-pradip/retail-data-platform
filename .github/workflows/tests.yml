name: Pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: retail_test_user
      POSTGRES_PASSWORD: temporary_ci_password
      POSTGRES_DB: retail_test_db
      RUN_DB_TESTS: "1"

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: retail_test_user
          POSTGRES_PASSWORD: temporary_ci_password
          POSTGRES_DB: retail_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U retail_test_user -d retail_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3,<4" "python-dotenv>=1,<2"

      - name: Apply schema migrations
        env:
          PGPASSWORD: temporary_ci_password
        run: |
          docker exec -i \
            -e PGPASSWORD="$PGPASSWORD" \
            "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            < sql/001_create_orders.sql

          docker exec -i \
            -e PGPASSWORD="$PGPASSWORD" \
            "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            < sql/002_add_source_updated_at.sql

      - name: Run all tests
        run: python -m unittest discover -s tests -v