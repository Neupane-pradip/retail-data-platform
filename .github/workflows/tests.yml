name: Pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: retail_test_user
      POSTGRES_PASSWORD: temporary_ci_password
      POSTGRES_DB: retail_test_db
      RUN_DB_TESTS: "1"

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: retail_test_user
          POSTGRES_PASSWORD: temporary_ci_password
          POSTGRES_DB: retail_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U retail_test_user -d retail_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3,<4" "python-dotenv>=1,<2"

      - name: Install dbt in a separate environment
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/python -m pip install --upgrade pip
          .venv-dbt/bin/python -m pip install \
            "dbt-core==1.12.6" \
            "dbt-postgres==1.11.0"
          .venv-dbt/bin/python -m pip check

      - name: Apply schema migrations
        env:
          PGPASSWORD: temporary_ci_password
        run: |
          for migration in \
            sql/001_create_orders.sql \
            sql/002_add_source_updated_at.sql \
            sql/004_create_customers.sql \
            sql/005_add_orders_customer_fk.sql \
            sql/006_create_products.sql \
            sql/007_create_order_items.sql
          do
            echo "Applying $migration"

            docker exec -i \
              -e PGPASSWORD="$PGPASSWORD" \
              "${{ job.services.postgres.id }}" \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 \
              < "$migration"
          done

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Load sample data and check reconciliation
        run: |
          python src/main.py
          python src/reconcile.py

      - name: Replay sample data and check reconciliation
        run: |
          python src/main.py
          python src/reconcile.py

      - name: Create temporary dbt connection profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profile"

          cat > "$RUNNER_TEMP/dbt-profile/profiles.yml" <<'YAML'
          retail_warehouse:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "{{ env_var('POSTGRES_HOST') }}"
                port: "{{ env_var('POSTGRES_PORT') | int }}"
                user: "{{ env_var('POSTGRES_USER') }}"
                password: "{{ env_var('POSTGRES_PASSWORD') }}"
                dbname: "{{ env_var('POSTGRES_DB') }}"
                schema: analytics
                threads: 2
                connect_timeout: 10
          YAML

      - name: Build and test warehouse
        run: |
          .venv-dbt/bin/dbt build \
            --project-dir warehouse \
            --profiles-dir "$RUNNER_TEMP/dbt-profile"