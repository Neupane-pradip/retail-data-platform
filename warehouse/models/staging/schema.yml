version: 2

models:
  - name: stg_customers
    description: "One row per customer."

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

      - name: city
        data_tests:
          - not_null

  - name: stg_products
    description: "One row per product, with its current catalogue price."

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: current_price_eur
        data_tests:
          - not_null

  - name: stg_orders
    description: "One row per order, representing its current source version."

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: order_amount_eur
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - cancelled
                  - refunded

      - name: source_updated_at
        data_tests:
          - not_null

  - name: stg_order_items
    description: "One row per order line, identified by order ID and line number."

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: line_number
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price_eur
        data_tests:
          - not_null